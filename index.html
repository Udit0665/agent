<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060a12">
  <title>Jarvis</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2335e0ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2335e0ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="offline">
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Jarvis</h1>
        <p id="subtitle">Connecting to your phone…</p>
      </div>
      <div class="telemetry">
        <span class="stat" id="stat-battery" title="Battery">--%</span>
        <span class="stat" id="stat-wifi" title="Wi-Fi">no wifi</span>
        <span class="stat" id="stat-llm" title="Local language model">LLM off</span>
      </div>
    </header>

    <section class="stage" aria-label="Assistant status">
      <canvas id="orb" aria-hidden="true"></canvas>
      <div class="status">
        <strong id="state-label">Offline</strong>
        <span id="state-hint">Start the server in Termux.</span>
      </div>
    </section>

    <section class="log" id="log" aria-live="polite">
      <p class="empty" id="empty">Say “Jarvis” followed by a command. Everything you say shows up here, and it keeps listening even if you close this page.</p>
    </section>

    <nav class="quick" id="quick" aria-label="Quick commands">
      <button type="button" data-cmd="battery status">Battery</button>
      <button type="button" data-cmd="take photo">Photo</button>
      <button type="button" data-cmd="take selfie">Selfie</button>
      <button type="button" data-cmd="torch on">Torch on</button>
      <button type="button" data-cmd="torch off">Torch off</button>
      <button type="button" data-cmd="where am i">Location</button>
      <button type="button" data-cmd="wifi status">Wi-Fi</button>
      <button type="button" data-cmd="read clipboard">Clipboard</button>
      <button type="button" data-cmd="volume up">Volume up</button>
      <button type="button" data-cmd="volume down">Volume down</button>
      <button type="button" data-cmd="vibrate">Vibrate</button>
      <button type="button" data-cmd="what time is it">Time</button>
    </nav>

    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="icon-btn" id="mic-btn" aria-pressed="true" aria-label="Microphone on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
      </button>
      <button type="button" class="icon-btn" id="wake-btn" aria-label="Wake Jarvis now">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
      </button>
      <input id="text-input" type="text" placeholder="Type a command" aria-label="Command">
      <button type="submit" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21 23 12 2 3v7l15 2-15 2v7Z"/></svg>
      </button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
